[common]
# interval in seconds to update entries
update = 10
# verify https certificate
verify = False
# show certificate warning
warnings = False
# DEBUG, INFO, ERROR check log in /var/log/pa_mapper.log
log = ERROR

[pa]
# use mgnt ip
ip = x.x.x.x
username = user
password = pass
# entry timeout in minutes
timeout = 5 

[unifi]
enable = false
baseurl = https://x.x.x.x:8443
site = default
username = user
password = pass

[omada]
enable = true
baseurl = https://x.x.x.x:8043
site = site-name
username = user
password = pass
